[project]
name = "backend"
version = "0.1.0"
description = "Backend for your music server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.12.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.124.0",
    "httpx>=0.28.1",
    "imagehash>=4.3.2",
    "libarchive-c>=5.3",
    "pillow>=12.1.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "starlette>=0.50.0",
    "uvicorn>=0.38.0",
    "watchdog>=6.0.0",
]

[tool.pytest.ini_options]
# Review r1 m-R1-56 / test-optimization 2026-11-13 (user decision): one
# worker per CPU by default; pin `-n 2` for like-for-like timings, `-n 0`
# runs serially (focused runs).
addopts = "-n auto"
# Phase 6.5 (plan D16): process-backed tests; tests/conftest.py skips them
# when the tool is absent.
markers = [
    "requires_ffmpeg: needs ffmpeg and ffprobe on PATH",
    "requires_fpcalc: needs fpcalc on PATH",
    "integration: needs a real external tool (ffmpeg/ffprobe/fpcalc) or a real child process or OS signal",
    "real_sqlite_durability: use the unwrapped sqlite3.connect (tests run with PRAGMA synchronous=OFF otherwise; see tests/conftest.py)",
]
